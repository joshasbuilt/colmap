<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floor Plan Viewer Output - Pre-Transform Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
        }
        
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        
        #controls {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(30, 30, 30, 0.95);
            padding: 15px;
            border-radius: 8px;
            max-width: 300px;
            max-height: calc(100vh - 20px);
            overflow-y: auto;
        }
        
        #controls h3 {
            margin: 0 0 10px 0;
            color: #4CAF50;
        }
        
        .control-group {
            margin-bottom: 15px;
        }
        
        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            color: #ccc;
        }
        
        .control-group input, .control-group select {
            width: 100%;
            padding: 5px;
            background: #333;
            border: 1px solid #555;
            color: #fff;
            border-radius: 3px;
        }
        
        .control-group button {
            width: 100%;
            padding: 8px;
            background: #0066cc;
            border: 1px solid #0088ff;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 5px;
        }
        
        .control-group button:hover {
            background: #0088ff;
        }
        
        #status {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
        }
        
        .info-panel {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(30, 30, 30, 0.95);
            padding: 15px;
            border-radius: 8px;
            max-width: 300px;
            font-size: 12px;
        }
        
        .info-item {
            margin-bottom: 5px;
        }
        
        .info-label {
            color: #4CAF50;
            font-weight: bold;
        }
        
        #view-cube-canvas {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 128px;
            height: 128px;
            border: 2px solid #333;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.7);
            cursor: pointer;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <canvas id="view-cube-canvas"></canvas>
    
    <div id="controls">
        <h3>Floor Plan Viewer Output</h3>
        
        <div class="control-group">
            <label>Load GeoJSON File:</label>
            <input type="file" id="geojson-file" accept=".geojson" />
        </div>
        
        <div class="control-group">
            <label>Point Size:</label>
            <input type="range" id="point-size" min="0.1" max="2" step="0.1" value="0.5" />
        </div>
        
        <div class="control-group">
            <label>Show Heights:</label>
            <input type="checkbox" id="show-heights" checked />
        </div>
        
        <div class="control-group">
            <label>Color by Group:</label>
            <input type="checkbox" id="color-by-group" checked />
        </div>
        
        <div class="control-group">
            <button id="reset-view">Reset View</button>
            <button id="export-data">Export Current View</button>
        </div>
    </div>
    
    <div class="info-panel" id="info-panel">
        <div class="info-item">
            <span class="info-label">Status:</span> <span id="status-text">Ready</span>
        </div>
        <div class="info-item">
            <span class="info-label">Points:</span> <span id="point-count">0</span>
        </div>
        <div class="info-item">
            <span class="info-label">Groups:</span> <span id="group-count">0</span>
        </div>
        <div class="info-item">
            <span class="info-label">Z-Range:</span> <span id="z-range">-</span>
        </div>
    </div>
    
    <div id="status">Loading...</div>

    <script>
        let scene, camera, renderer, controls, transformControls;
        let cameraPoints = [];
        let pointMeshes = [];
        let groupColors = {};
        let currentGroup = null;
        let viewCube, viewCubeScene, viewCubeCamera, viewCubeRenderer;
        
        // Color palette for groups
        const colorPalette = [
            { name: 'Red', hex: 0xff4444, rgb: [255, 68, 68] },
            { name: 'Green', hex: 0x44ff44, rgb: [68, 255, 68] },
            { name: 'Blue', hex: 0x4444ff, rgb: [68, 68, 255] },
            { name: 'Yellow', hex: 0xffff44, rgb: [255, 255, 68] },
            { name: 'Magenta', hex: 0xff44ff, rgb: [255, 68, 255] },
            { name: 'Cyan', hex: 0x44ffff, rgb: [68, 255, 255] },
            { name: 'Orange', hex: 0xff8844, rgb: [255, 136, 68] }
        ];
        
        function init() {
            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);
            
            // Camera setup
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 50);
            
            // Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            // Controls setup
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            
            // Transform controls
            transformControls = new THREE.TransformControls(camera, renderer.domElement);
            scene.add(transformControls);
            
            // Initialize ViewCube
            initViewCube();
            
            // Event listeners
            setupEventListeners();
            
            // Start render loop
            animate();
            
            document.getElementById('status').textContent = 'Ready - Load a GeoJSON file';
        }
        
        function setupEventListeners() {
            // File input
            document.getElementById('geojson-file').addEventListener('change', handleFileLoad);
            
            // Controls
            document.getElementById('point-size').addEventListener('input', updatePointSize);
            document.getElementById('show-heights').addEventListener('change', toggleHeights);
            document.getElementById('color-by-group').addEventListener('change', updateColors);
            document.getElementById('reset-view').addEventListener('click', resetView);
            document.getElementById('export-data').addEventListener('click', exportData);
            
            // Window resize
            window.addEventListener('resize', onWindowResize);
        }
        
        function handleFileLoad(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    loadGeoJSONData(data);
                } catch (error) {
                    console.error('Error parsing GeoJSON:', error);
                    document.getElementById('status').textContent = 'Error parsing GeoJSON file';
                }
            };
            reader.readAsText(file);
        }
        
        function loadGeoJSONData(data) {
            console.log('Loading GeoJSON data:', data);
            
            // Clear existing points
            clearPoints();
            
            cameraPoints = [];
            groupColors = {};
            
            // Process features
            data.features.forEach((feature, index) => {
                if (feature.geometry && feature.geometry.type === 'Point') {
                    const coords = feature.geometry.coordinates;
                    const props = feature.properties || {};
                    
                    // Use 3D coordinates for X,Y and Z (preserve relative positioning)
                    let x = 0, y = 0, z = 0;
                    
                    // Use 3D coordinates for X, Y, Z (all from the corrected 3D viewer)
                    if (props.coords3D) {
                        const match = props.coords3D.match(/3D: \(([^,]+), ([^,]+), ([^)]+)\)/);
                        if (match) {
                            x = parseFloat(match[1]); // X from 3D coordinates
                            y = parseFloat(match[2]); // Y from 3D coordinates  
                            z = parseFloat(match[3]); // Z from 3D coordinates
                        }
                    }
                    
                    // If no 3D coordinates, fall back to scaled Mt Eden coordinates
                    if (x === 0 && y === 0 && z === 0 && props.easting && props.northing) {
                        // Scale Mt Eden coordinates to match 3D coordinate range
                        // Use a reasonable scale factor to bring GPS coordinates into 3D model range
                        const scaleFactor = 0.001; // Adjust this to get reasonable positioning
                        x = (props.easting - 397900) * scaleFactor; // Center around base point
                        y = (props.northing - 808200) * scaleFactor; // Center around base point
                        z = props.height || 0; // Use height directly
                    }
                    
                    // Get group info
                    const group = props.group || 'Unknown';
                    if (!groupColors[group]) {
                        const colorIndex = Object.keys(groupColors).length % colorPalette.length;
                        groupColors[group] = colorPalette[colorIndex];
                    }
                    
                    cameraPoints.push({
                        x: x,
                        y: y,
                        z: z,
                        group: group,
                        imageName: props.imageName || 'unknown',
                        frame: props.frame || 'unknown',
                        originalCoords: coords
                    });
                }
            });
            
            console.log(`Loaded ${cameraPoints.length} camera points`);
            
            // Auto-center the view based on average point position
            if (cameraPoints.length > 0) {
                const avgX = cameraPoints.reduce((sum, p) => sum + p.x, 0) / cameraPoints.length;
                const avgY = cameraPoints.reduce((sum, p) => sum + p.y, 0) / cameraPoints.length;
                const avgZ = cameraPoints.reduce((sum, p) => sum + p.z, 0) / cameraPoints.length;
                
                console.log(`Average position: (${avgX.toFixed(2)}, ${avgY.toFixed(2)}, ${avgZ.toFixed(2)})`);
                
                // Center camera on average position
                camera.position.set(avgX, avgY + 50, avgZ + 50); // Offset for better viewing angle
                camera.lookAt(avgX, avgY, avgZ);
                controls.target.set(avgX, avgY, avgZ);
                controls.update();
                
                console.log(`Camera repositioned to: (${camera.position.x.toFixed(2)}, ${camera.position.y.toFixed(2)}, ${camera.position.z.toFixed(2)})`);
            }
            
            createPointMeshes();
            updateInfo();
            document.getElementById('status').textContent = `Loaded ${cameraPoints.length} points from ${Object.keys(groupColors).length} groups`;
        }
        
        function createPointMeshes() {
            const pointSize = parseFloat(document.getElementById('point-size').value);
            const showHeights = document.getElementById('show-heights').checked;
            const colorByGroup = document.getElementById('color-by-group').checked;
            
            cameraPoints.forEach((point, index) => {
                // Create sphere geometry
                const geometry = new THREE.SphereGeometry(pointSize, 8, 6);
                
                // Choose color
                let color;
                if (colorByGroup && groupColors[point.group]) {
                    color = new THREE.Color(groupColors[point.group].hex);
                } else {
                    color = new THREE.Color(0xffffff);
                }
                
                const material = new THREE.MeshBasicMaterial({ color: color });
                const mesh = new THREE.Mesh(geometry, material);
                
                // Position the mesh
                mesh.position.set(point.x, point.y, point.z);
                
                // Store point data
                mesh.userData = {
                    pointIndex: index,
                    group: point.group,
                    imageName: point.imageName,
                    frame: point.frame,
                    originalCoords: point.originalCoords
                };
                
                scene.add(mesh);
                pointMeshes.push(mesh);
            });
        }
        
        function clearPoints() {
            pointMeshes.forEach(mesh => {
                scene.remove(mesh);
                mesh.geometry.dispose();
                mesh.material.dispose();
            });
            pointMeshes = [];
        }
        
        function updatePointSize() {
            const size = parseFloat(document.getElementById('point-size').value);
            pointMeshes.forEach(mesh => {
                mesh.geometry.dispose();
                mesh.geometry = new THREE.SphereGeometry(size, 8, 6);
            });
        }
        
        function toggleHeights() {
            // This would be used to show/hide height information
            updateColors();
        }
        
        function updateColors() {
            const colorByGroup = document.getElementById('color-by-group').checked;
            
            pointMeshes.forEach(mesh => {
                const pointData = mesh.userData;
                let color;
                
                if (colorByGroup && groupColors[pointData.group]) {
                    color = new THREE.Color(groupColors[pointData.group].hex);
                } else {
                    color = new THREE.Color(0xffffff);
                }
                
                mesh.material.color = color;
            });
        }
        
        function resetView() {
            camera.position.set(0, 0, 50);
            controls.reset();
        }
        
        function exportData() {
            if (cameraPoints.length === 0) {
                alert('No data to export');
                return;
            }
            
            const exportData = {
                timestamp: new Date().toISOString(),
                totalPoints: cameraPoints.length,
                groups: Object.keys(groupColors),
                points: cameraPoints.map(point => ({
                    x: point.x,
                    y: point.y,
                    z: point.z,
                    group: point.group,
                    imageName: point.imageName,
                    frame: point.frame
                }))
            };
            
            const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `floor_plan_output_${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
        
        function updateInfo() {
            if (cameraPoints.length === 0) {
                document.getElementById('point-count').textContent = '0';
                document.getElementById('group-count').textContent = '0';
                document.getElementById('z-range').textContent = '-';
                return;
            }
            
            const zValues = cameraPoints.map(p => p.z);
            const minZ = Math.min(...zValues);
            const maxZ = Math.max(...zValues);
            
            document.getElementById('point-count').textContent = cameraPoints.length;
            document.getElementById('group-count').textContent = Object.keys(groupColors).length;
            document.getElementById('z-range').textContent = `${minZ.toFixed(2)} to ${maxZ.toFixed(2)}`;
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function initViewCube() {
            // Create ViewCube scene
            viewCubeScene = new THREE.Scene();
            
            // Create ViewCube camera
            viewCubeCamera = new THREE.OrthographicCamera(-1.5, 1.5, 1.5, -1.5, 1, 10);
            viewCubeCamera.position.set(0, 0, 5);
            viewCubeCamera.lookAt(0, 0, 0);
            
            // Create ViewCube renderer
            const canvas = document.getElementById('view-cube-canvas');
            viewCubeRenderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true });
            viewCubeRenderer.setSize(128, 128);
            viewCubeRenderer.setClearColor(0x000000, 0);
            
            // Create cube geometry
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            
            // Create materials for each face
            const materials = [
                createFaceMaterial('RIGHT', 0xff0000),
                createFaceMaterial('LEFT', 0x00ffff),
                createFaceMaterial('TOP', 0x00ff00),
                createFaceMaterial('BOTTOM', 0xff00ff),
                createFaceMaterial('FRONT', 0x0000ff),
                createFaceMaterial('BACK', 0xffff00)
            ];
            
            viewCube = new THREE.Mesh(geometry, materials);
            viewCubeScene.add(viewCube);
            
            // Add edge lines
            const edges = new THREE.EdgesGeometry(geometry);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xffffff }));
            viewCube.add(line);
            
            // Add ViewCube click handler
            canvas.addEventListener('click', onViewCubeClick);
        }
        
        function createFaceMaterial(text, color) {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            
            // Background
            ctx.fillStyle = `#${color.toString(16).padStart(6, '0')}`;
            ctx.fillRect(0, 0, 128, 128);
            
            // Text
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 20px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 64, 64);
            
            const texture = new THREE.CanvasTexture(canvas);
            return new THREE.MeshBasicMaterial({ map: texture });
        }
        
        function onViewCubeClick(event) {
            const rect = event.target.getBoundingClientRect();
            const x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            const y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(x, y), viewCubeCamera);
            
            const intersects = raycaster.intersectObject(viewCube);
            if (intersects.length > 0) {
                const face = intersects[0].face;
                const normal = face.normal.clone();
                normal.transformDirection(viewCube.matrixWorld);
                
                // Calculate new camera position relative to current target
                const currentTarget = controls.target.clone();
                const distance = camera.position.distanceTo(currentTarget);
                const newPosition = normal.multiplyScalar(distance).add(currentTarget);
                
                camera.position.copy(newPosition);
                camera.lookAt(currentTarget);
                controls.target.copy(currentTarget);
                controls.update();
            }
        }
        
        function updateViewCube() {
            // Sync ViewCube rotation with main camera
            viewCube.rotation.copy(camera.rotation);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            controls.update();
            updateViewCube();
            renderer.render(scene, camera);
            viewCubeRenderer.render(viewCubeScene, viewCubeCamera);
        }
        
        // Initialize when page loads
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
