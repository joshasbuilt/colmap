<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Variant - screenshot try 2</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <style>body{margin:0}#ui-panel{position:fixed;left:8px;top:8px;background:#fff;padding:8px;border-radius:4px;z-index:10}</style>
</head>
<body>
  <div id="ui-panel"><strong>Variant:</strong> Swap OFF, Negate Y ON, Invert X OFF, Invert Y/Z ON (controls shown)</div>
  <a-scene loading-screen="enabled:false">
    <a-sky id="panorama-sky"></a-sky>
    <a-entity id="spheres-container"></a-entity>
    <a-entity id="camera-rig"><a-camera id="main-camera"></a-camera></a-entity>
  </a-scene>

  <script>
    // PAGE_CONFIG for this variant — checkboxes default to the second screenshot state
    window.PAGE_CONFIG = {
      DATA_FILE: 'cone_data.json',
      FLIP_YZ_ON_LOAD: false,   // Swap Y/Z unchecked
      NEGATE_Y_ON_LOAD: true,   // Negate Y checked
      NEGATE_Z_ON_LOAD: false,  // Negate Z unchecked
      INVERT_X_SIGN: false,     // Invert X unchecked
      INVERT_Y_SIGN: true,      // Invert Y checked
      INVERT_Z_SIGN: true,      // Invert Z checked
      REMOVE_SKY: true,
      SHOW_MAPPING_CONTROLS: true
    };
  </script>
  <script src="navigation-system.js"></script>
</body>
</html>
